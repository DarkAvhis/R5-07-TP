name: Q3
on:
  push:
    paths:
      - 'Q3.java'
      - '.github/workflows/Q3.yaml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archives
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
      - name: Creation de l'archive
        run: |
          {
            echo "Nom et prenom : Enzo Dumont"
            cat Q3.java
          } > "Q3_archive_java.txt"
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Q3_archive_java.txt
          git commit -m "Q3 : archive de Q3.java" || echo "rien a commiter"
          git pull --rebase origin main
          git push
