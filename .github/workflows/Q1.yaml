name: Q1
on:
  push:
    paths:
      - 'XYZ.txt'
      - 'README.md'
      - '.github/workflows/Q1.yaml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: archives
  cancel-in-progress: false
jobs:
  archive:
    runs-on: ubuntu-latest
    steps:
      - name: Recuperation du depot
        uses: actions/checkout@v4
      - name: Creation de Q1_archive_XYZ.txt
        run: cat XYZ.txt > Q1_archive_XYZ.txt
      - name: Commit et push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Q1_archive_XYZ.txt
          git commit -m "Q1 : archive de XYZ.txt" || echo "rien a commiter"
          git pull --rebase origin main
          git push
